apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-core
  namespace: argocd

spec:
  source:
    helm:
      valuesObject:
        global:
          clusterName: cace-1-dev
        bootstrap:
          cloudflareOperator:
            # Disabled 2026-09-07 — pivoting to Tailscale Operator + Funnel.
            # Re-enable by flipping enabled: true.
            enabled: false
          tailscaleOperator:
            # Activated 2026-09-07 — opt-in from DramisInfo/platform-helm PR #123.
            # Chart version managed centrally in platform-helm via version-bump workflow.
            enabled: true
          # Disabled 2026-11-21 — slimming cace-1-dev to one worker so a mini PC
          # can leave the Proxmox cluster. Re-enable by flipping enabled: true.
          gatekeeper:
            enabled: false
            policies:
              excludedNamespaces:
                - kube-system
                - gatekeeper-system
                - cert-manager
                - istio-system
                - argocd
                - azure-arc
                - it-gitops-enterprise-prd
          hermesSre:
            enabled: false
          monitoring:
            enabled: false
          # Disabled 2026-11-21 — no workload left on cace-1-dev uses them.
          keda:
            enabled: false
          k6Operator:
            enabled: false
          cnpg:
            enabled: false
          argocd:
            smeeUrl: "https://smee.io/AC2s1ASzSClbnZxI"
          # Disabled 2026-11-21 with the Composio relay and Gmail worker, their
          # only users (agent-bus was a misconfiguration; Argo Events has its own bus).
          nats:
            enabled: false
            # Gateway to cace-2-dev removed 2026-06-23 — that cluster no longer exists,
            # and the gateway connection was blocking JetStream metadata RAFT from
            # electing a leader (constant "no metadata leader" warnings).
            gateway:
              enabled: false
              name: "cace-1-dev-cluster"
              advertise: "nats.cace-1-dev.dramisinfo.com:7222"
              gateways: []
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
